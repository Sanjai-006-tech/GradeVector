# Dashboard theme: the same palette as the charts and the HTML report.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
showWidgetBorder = true
baseRadius = "medium"

[browser]
gatherUsageStats = false
